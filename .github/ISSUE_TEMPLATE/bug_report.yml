name: 🐛 Bug Report
description: Report a bug or unexpected behavior in AdCheck
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Share whatever details you can, even if it's just a short description.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear, concise description of what went wrong.
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how to trigger this bug.
      placeholder: |
        1. Open a page with ad tags
        2. Enable AdCheck from the popup
        3. ...

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?

  - type: input
    id: browser
    attributes:
      label: Browser & Version
      description: "e.g. Chrome 126, Edge 126"
      placeholder: Chrome 126

  - type: input
    id: extension_version
    attributes:
      label: Extension Version
      description: "Visible in chrome://extensions or the popup footer."
      placeholder: "1.0.0"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Recordings
      description: Drag & drop any screenshots or screen recordings that help explain the issue.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else — console errors, page URL (if public), related config, etc.
